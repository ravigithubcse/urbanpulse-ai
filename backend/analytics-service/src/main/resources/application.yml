spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urbanpulse}
    username: ${DB_USER:urbanpulse}
    password: ${DB_PASSWORD:urbanpulse_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.urbanpulse.analytics: INFO