name: CI - Backend Services

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, infrastructure-service, alert-service, analytics-service, api-gateway]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        mvn clean compile -B

    - name: Run Tests
      run: |
        cd backend/${{ matrix.service }}
        mvn test -B

    - name: Generate Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results - ${{ matrix.service }}
        path: backend/${{ matrix.service }}/target/surefire-reports/*.xml
        reporter: java-junit

    - name: Build Docker Image
      run: |
        cd backend/${{ matrix.service }}
        docker build -t urbanpulse/${{ matrix.service }}:${{ github.sha }} .

    - name: Run Security Scan
      uses: anchore/scan-action@v3
      with:
        image: urbanpulse/${{ matrix.service }}:${{ github.sha }}
        fail-build: false

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: urbanpulse
          POSTGRES_PASSWORD: test
          POSTGRES_DB: urbanpulse_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Integration Tests
      run: |
        cd backend/auth-service
        mvn test -Dspring.profiles.active=integration-test -B
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: urbanpulse_test
        DB_USER: urbanpulse
        DB_PASSWORD: test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
