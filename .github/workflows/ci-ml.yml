name: CI - ML Services

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ml-services/**'
      - '.github/workflows/ci-ml.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ml-services/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        cd ml-services/prediction-service
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run Tests
      run: |
        cd ml-services/prediction-service
        pytest tests/ -v || true

    - name: Build Docker Image
      run: |
        cd ml-services/prediction-service
        docker build -t urbanpulse/prediction-service:${{ github.sha }} .

    - name: Run Security Scan
      uses: anchore/scan-action@v3
      with:
        image: urbanpulse/prediction-service:${{ github.sha }}
        fail-build: false
