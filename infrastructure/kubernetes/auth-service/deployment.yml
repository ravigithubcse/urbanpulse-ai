apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: urbanpulse
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: urbanpulse/auth-service:1.0.0
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: urbanpulse-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: urbanpulse-secrets
              key: db-password
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: urbanpulse
spec:
  selector:
    app: auth-service
  ports:
  - port: 8082
    targetPort: 8082
