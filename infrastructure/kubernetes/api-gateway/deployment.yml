apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: urbanpulse
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: urbanpulse/api-gateway:1.0.0
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: urbanpulse-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: urbanpulse
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8081
  type: LoadBalancer
